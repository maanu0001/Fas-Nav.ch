name: Mail Center E2E Smoke (temporary)
on:
  push:
    paths:
      - ".github/workflows/mail-center-e2e-smoke.yml"
permissions:
  contents: read
concurrency:
  group: mail-center-smoke-test
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Teste SMTP > IMAP > Konversationen auf dem Produktionsserver
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/fas-nav/app
          secret="$(sed -n 's/^CRON_SECRET=//p' .env | tail -n 1 | tr -d '\r')"
          secret="${secret#\"}"
          secret="${secret%\"}"
          test -n "$secret" || { echo "Server-Secret fehlt."; exit 1; }
          # Warten, bis das neue Deployment mit dem E2E-Endpunkt bereitsteht.
          for attempt in $(seq 1 70); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/api/jobs/mail-center/self-test || true)"
            if [ "$code" = "403" ] || [ "$code" = "405" ]; then break; fi
            sleep 6
          done
          if [ "$code" != "403" ] && [ "$code" != "405" ]; then echo "E2E-Endpunkt nach Deployment nicht erreichbar: HTTP $code"; exit 1; fi
          response="$(printf 'header = "Authorization: Bearer %s"\n' "$secret" | curl -sS -K - --max-time 100 -X POST -w '\n%{http_code}' http://127.0.0.1:3000/api/jobs/mail-center/self-test)"
          status="$(printf '%s\n' "$response" | tail -n 1)"
          echo "Mail-E2E-Testergebnis: $(printf '%s\n' "$response" | head -n 1 | cut -c 1-300)"
          test "$status" = "200" || { echo "Mail-E2E fehlgeschlagen (HTTP $status)."; exit 1; }
          REMOTE
      - name: SSH-Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key
