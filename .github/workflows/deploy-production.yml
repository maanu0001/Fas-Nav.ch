name: Deploy Production

# Produktives Deployment von Fas-Nav.ch.
#
# Ablauf: Bei jedem Push auf main wird zuerst vollständig geprüft und gebaut.
# Nur wenn das fehlerfrei durchläuft, wird per SSH auf den Produktionsserver
# deployed. Schlägt ein Prüfschritt fehl, findet kein Deployment statt.

on:
  push:
    branches: [main]
  # Erlaubt ein erneutes Ausrollen des aktuellen Stands ohne neuen Commit.
  workflow_dispatch:

# Zwei gleichzeitige Deployments auf denselben Server würden sich in die Quere
# kommen. Laufende Deployments werden deshalb nicht abgebrochen, sondern der
# nächste Lauf wartet.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Platzhalter: Weder die Codegenerierung noch der Build stellen eine
      # Datenbankverbindung her. Prisma benötigt lediglich eine syntaktisch
      # gültige URL, um das Schema einzulesen.
      DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
      NEXT_PUBLIC_APP_URL: https://fas-nav.ch
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          # Entspricht der Node-Version des Produktions-Images (node:22-alpine).
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prisma Client erzeugen
        run: npx prisma generate

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Automatisierte Tests ausführen
        run: npm test

      - name: Lint prüfen
        run: npm run lint

      - name: Production Build
        run: npm run build

  deploy:
    name: Auf Produktionsserver ausrollen
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: SSH-Zugang vorbereiten
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Secret SERVER_SSH_KEY fehlt."
            exit 1
          fi
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Secret PRODUCTION_SSH_KNOWN_HOSTS fehlt. Auf einem vertrauenswuerdigen Rechner erzeugen mit: ssh-keyscan <host>"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Der Hostschlüssel wird geprüft; ein unbekannter Server bricht ab.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deployment ausführen
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::Secrets SERVER_HOST und SERVER_USER werden benötigt."
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -p 22 \
              "$SSH_USER@$SSH_HOST" \
              'bash -s' <<'REMOTE' | tee /tmp/deploy.log
          set -euo pipefail

          # Das Skript erreicht den Server über stdin. Der gesamte Ablauf steht
          # deshalb in einer Funktion, die mit abgehängtem stdin aufgerufen
          # wird. Andernfalls reichen Befehle wie "docker compose run" oder
          # "docker compose exec" den noch ungelesenen Rest des Skripts an den
          # Container weiter; die Shell sieht dann vorzeitig das Dateiende und
          # endet mit Status 0 – das Deployment würde als erfolgreich gelten,
          # obwohl die Anwendung nie gestartet wurde.
          deploy() {
            APP_DIR=/opt/fas-nav/app
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"

            cd "$APP_DIR"

            # Docker Compose v2 bevorzugen, ältere Installationen weiterhin
            # unterstützen.
            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose $COMPOSE_FILES "$@"; }
            elif command -v docker-compose >/dev/null 2>&1; then
              compose() { docker-compose $COMPOSE_FILES "$@"; }
            else
              echo "Docker Compose ist auf dem Server nicht verfügbar." >&2
              exit 1
            fi

            echo "==> Aktuellen Stand von origin/main holen"
            git fetch --prune origin main
            # Harter Abgleich auf den Remote-Stand. Bewusst kein "git clean":
            # .env und andere nicht versionierte Betriebsdateien müssen
            # erhalten bleiben.
            git checkout -B main origin/main
            git reset --hard origin/main
            echo "    Stand: $(git rev-parse --short HEAD) – $(git log -1 --pretty=%s)"

            # Der Dienst "migrate" liegt im Profil "tools" und läuft nur auf
            # Zuruf. Für Build und Migration wird das Profil aktiviert, danach
            # wieder abgeschaltet, damit "up" ausschliesslich die dauerhaft
            # laufenden Dienste startet.
            export COMPOSE_PROFILES=tools

            echo "==> Images bauen"
            compose build --pull

            echo "==> Datenbank starten"
            compose up -d db

            echo "==> Sicherung vor Migrationen"
            # Before touching the schema, create a validated restore point for the
            # currently running production version (first install may lack app).
            current_app="$(compose ps -q app 2>/dev/null || true)"
            if [ -n "$current_app" ] && [ "$(docker inspect -f '{{.State.Running}}' "$current_app" 2>/dev/null || true)" = "true" ]; then
              bash scripts/backup-production.sh
            else
              echo "    Erstinstallation / keine laufende App: keine Daten zu sichern"
            fi

            echo "==> Migrationen anwenden"
            # Eigener Dienst mit vollständigen Abhängigkeiten. Das schlanke
            # Laufzeit-Image kann die Prisma-CLI nicht ausführen; Begründung
            # steht in docker-compose.yml.
            compose run --rm -T migrate

            unset COMPOSE_PROFILES

            echo "==> Lage vor dem Start"
            # Rein informativ: Wer lauscht auf Port 3000 und in welchem
            # Zustand sind die Container? Ein Container in einer
            # Neustartschleife ist hier sofort erkennbar.
            if command -v ss >/dev/null 2>&1; then
              ss -ltnp 2>/dev/null | grep -E ':3000[[:space:]]' || echo "    kein Listener auf Port 3000"
            elif command -v netstat >/dev/null 2>&1; then
              netstat -ltnp 2>/dev/null | grep -E ':3000[[:space:]]' || echo "    kein Listener auf Port 3000"
            fi
            docker ps -a --format '    {{.Names}} | {{.Status}} | {{.Ports}}' | head -20

            echo "==> Container starten"
            # Den alten Anwendungscontainer zuerst entfernen. Startet er nach
            # einem Absturz immer wieder neu, belegt er den Port zeitweise und
            # das Anlegen des neuen Containers scheitert an genau diesem
            # Wettrennen.
            compose stop app >/dev/null 2>&1 || true
            compose rm -f app >/dev/null 2>&1 || true

            if ! compose up -d --remove-orphans; then
              echo "Die Container liessen sich nicht starten." >&2
              compose ps -a
              compose logs --tail=200 app >&2
              exit 1
            fi

            echo "==> Health-Check"
            # Das Image bringt einen eigenen HEALTHCHECK auf /api/health mit.
            # Statt bei jedem Versuch einen Prozess im Container zu starten,
            # wird dessen Ergebnis abgefragt. Das ist deutlich günstiger und
            # gibt bei jedem Versuch eine Zeile aus – die Verbindung bleibt
            # damit auch über einen langsamen Start hinweg beschäftigt.
            app_container="$(compose ps -q app)"
            if [ -z "$app_container" ]; then
              echo "Der Anwendungscontainer wurde nicht gestartet." >&2
              compose ps
              exit 1
            fi

            ok=0
            for attempt in $(seq 1 40); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$app_container" 2>/dev/null || echo unbekannt)"
              running="$(docker inspect -f '{{.State.Status}}' "$app_container" 2>/dev/null || echo unbekannt)"
              echo "    Versuch $attempt: Container $running, Health $status"
              if [ "$status" = "healthy" ]; then
                ok=1
                break
              fi
              if [ "$running" = "exited" ]; then
                echo "Der Anwendungscontainer hat sich beendet." >&2
                break
              fi
              sleep 5
            done

            if [ "$ok" -ne 1 ]; then
              echo "Die Anwendung ist nach dem Deployment nicht betriebsbereit." >&2
              compose ps
              compose logs --tail=120 app >&2
              exit 1
            fi

            echo "==> Nicht mehr benötigte Images entfernen"
            docker image prune -f >/dev/null 2>&1 || true

            compose ps
            echo "==> Deployment abgeschlossen"
          }

          deploy < /dev/null
          REMOTE

          # Sicherheitsnetz gegen ein stillschweigend abgebrochenes Skript:
          # Ohne die Schlussmeldung gilt das Deployment als fehlgeschlagen,
          # auch wenn ssh mit 0 zurückkehrt.
          if ! grep -qx '==> Deployment abgeschlossen' /tmp/deploy.log; then
            echo "::error::Das Deployment-Skript lief nicht bis zum Ende durch."
            exit 1
          fi

      - name: SSH-Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key
